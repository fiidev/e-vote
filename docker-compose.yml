version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: e-vote-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-e-vote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-e-vote-secret}
      POSTGRES_DB: ${POSTGRES_DB:-e-vote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-e-vote}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: e-vote-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-e-vote}:${POSTGRES_PASSWORD:-e-vote-secret}@postgres:5432/${POSTGRES_DB:-e-vote}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Admin
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_RATE_PER_MINUTE: ${SMTP_RATE_PER_MINUTE:-100}
      SMTP_DAILY_CAP: ${SMTP_DAILY_CAP:-1990}
      # School
      SCHOOL_NAME: ${SCHOOL_NAME}
      VOTING_LOCATION: ${VOTING_LOCATION}
      FROM_NAME: ${FROM_NAME}
      # App
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: